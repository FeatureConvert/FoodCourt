name: Fable
options:
  bundleIdPrefix: com.fable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "5X98G8X3FJ"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Fable:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fable.foodcourt
        PRODUCT_NAME: Fable
        # iCloud key-value sync. Needs a signing team with iCloud enabled; the simulator
        # ignores it and the game falls back to local-only storage.
        CODE_SIGN_ENTITLEMENTS: Sources/Fable.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Food Court
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # iPhone's default and floor: portrait-only, unaffected by the iPad landscape work
        # below. iPad's actual orientation list lives in Sources/Info.plist as a literal
        # UISupportedInterfaceOrientations~ipad key - GENERATE_INFOPLIST_FILE's
        # INFOPLIST_KEY_* synthesis does not honor the ~ipad device-idiom suffix (verified:
        # an INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad build setting here silently
        # never made it into the built app's Info.plist), so the key has to be hand-written
        # into the source plist that GENERATE_INFOPLIST_FILE merges into instead.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Apple requires an app that restricts orientation to also opt out of Slide
        # Over/Split View, or support every orientation (including upside-down, which nothing
        # here does). Opting out avoids the much larger job of an arbitrary-width adaptive
        # layout for multitasking - this only ever renders at two known aspect ratios.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "4"

  FableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FableTests
      # SKTestSession loads the configuration from the test bundle, so it has to ship
      # with the tests as well as with the app.
      - path: Sources/Store/Products.storekit
        buildPhase: resources
    dependencies:
      - target: Fable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fable.foodcourt.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fable:
    build:
      targets:
        Fable: all
        FableTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Sources/Store/Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      # The test plan is what carries the StoreKit configuration into `xcodebuild test`;
      # the scheme's own storeKitConfiguration is only honoured by the Xcode UI.
      testPlans:
        - path: Fable.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
