name: Fable
options:
  bundleIdPrefix: com.fable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "5X98G8X3FJ"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Fable:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fable.foodcourt
        PRODUCT_NAME: Fable
        # iCloud key-value sync. Needs a signing team with iCloud enabled; the simulator
        # ignores it and the game falls back to local-only storage.
        CODE_SIGN_ENTITLEMENTS: Sources/Fable.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Food Court Tycoon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad is in TARGETED_DEVICE_FAMILY below; Apple requires an app that restricts
        # orientation to also opt out of Slide Over/Split View, or support every orientation.
        # This is a portrait-locked phone-style game, so it opts out rather than adding
        # landscape layouts it was never designed for.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  FableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FableTests
      # SKTestSession loads the configuration from the test bundle, so it has to ship
      # with the tests as well as with the app.
      - path: Sources/Store/Products.storekit
        buildPhase: resources
    dependencies:
      - target: Fable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fable.foodcourt.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fable:
    build:
      targets:
        Fable: all
        FableTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Sources/Store/Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      # The test plan is what carries the StoreKit configuration into `xcodebuild test`;
      # the scheme's own storeKitConfiguration is only honoured by the Xcode UI.
      testPlans:
        - path: Fable.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
