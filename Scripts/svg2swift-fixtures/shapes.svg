<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="#F2EDE2" stroke="#2B1D14" stroke-width="4">
    <!-- saucer: rect with corner radii -->
    <rect x="14" y="78" width="72" height="10" rx="5" ry="5" fill="#C9AE86"/>
    <!-- cup body: path with curves and a close -->
    <path d="M26 34 L74 34 C74 34 72 76 50 76 C28 76 26 34 26 34 Z"/>
    <!-- handle: an elliptical ARC, the part most likely to be wrong -->
    <path d="M74 44 A14 12 0 0 1 74 66" fill="none" stroke-width="5"/>
    <!-- steam: quadratics, smooth continuation, relative commands -->
    <g fill="none" stroke="#B3A8C0" stroke-width="3" opacity="0.8">
      <path d="M40 26 q6 -8 0 -16 t0 -0"/>
      <path d="m52 24 q6 -8 0 -16"/>
    </g>
  </g>
  <!-- nested transform: rotate about a point, inside a translate -->
  <g transform="translate(6,4)">
    <g transform="rotate(18, 50, 50)">
      <ellipse cx="50" cy="52" rx="9" ry="4" fill="#E4453A" fill-opacity="0.55"/>
    </g>
  </g>
  <!-- style attribute should beat the presentation attribute -->
  <circle cx="18" cy="18" r="6" fill="#000000" style="fill:#F5C242;stroke:#2B1D14;stroke-width:2"/>
  <polygon points="82,10 90,26 74,26" fill="#57A773"/>
  <polyline points="8,60 14,54 20,60" fill="#ff0000" stroke="#2B1D14" stroke-width="2"/>
  <line x1="30" y1="92" x2="70" y2="92" stroke="#2B1D14" stroke-width="2"/>
  <defs><linearGradient id="g"><stop offset="0"/></linearGradient></defs>
</svg>
