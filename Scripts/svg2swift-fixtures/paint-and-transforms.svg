<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 20 100 100">
  <!-- viewBox with a non-zero origin: everything should shift by (-10,-20) -->
  <rect x="10" y="20" width="20" height="10" fill="rgb(255,0,0)"/>
  <rect x="35" y="20" width="20" height="10" fill="rgb(0, 128, 255)"/>
  <rect x="60" y="20" width="20" height="10" fill="#0f0"/>
  <rect x="85" y="20" width="20" height="10" fill="tomato"/>
  <!-- skewX / skewY / matrix -->
  <g transform="skewX(20)"><rect x="10" y="40" width="18" height="10" fill="teal"/></g>
  <g transform="skewY(15)"><rect x="40" y="40" width="18" height="10" fill="navy"/></g>
  <g transform="matrix(1.5 0 0 0.5 -5 30)"><rect x="50" y="40" width="18" height="10" fill="olive"/></g>
  <!-- even-odd: a donut. With nonzero it fills solid; with evenodd the hole shows -->
  <path fill-rule="evenodd" fill="purple"
        d="M30 85 m-18 0 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0 M30 85 m-9 0 a9 9 0 1 1 18 0 a9 9 0 1 1 -18 0"/>
  <!-- caps and joins should come through, not be forced round -->
  <polyline points="65,75 80,95 95,75" fill="none" stroke="black" stroke-width="6"
            stroke-linecap="square" stroke-linejoin="bevel"/>
  <!-- percentage-suffixed length, and stroke width under a scaled group -->
  <g transform="scale(2)"><line x1="5" y1="55" x2="20" y2="55" stroke="maroon" stroke-width="3"/></g>
  <!-- colour-carried alpha: must compose with fill-opacity/opacity, not be dropped -->
  <rect x="10" y="105" width="14" height="8" fill="rgba(255,128,0,0.5)"/>
  <rect x="28" y="105" width="14" height="8" fill="#11223344"/>
  <rect x="46" y="105" width="14" height="8" fill="rgba(0,0,0,0.8)" fill-opacity="0.5"/>
  <rect x="64" y="105" width="14" height="8" fill="none" stroke="rgba(0,128,0,0.4)" stroke-width="2"/>
  <!-- hidden layers must not draw; dashes must survive as a dash pattern -->
  <rect x="10" y="118" width="12" height="6" fill="red" display="none"/>
  <rect x="26" y="118" width="12" height="6" fill="red" visibility="hidden"/>
  <g display="none"><rect x="42" y="118" width="12" height="6" fill="red"/></g>
  <line x1="58" y1="121" x2="100" y2="121" stroke="navy" stroke-width="2"
        stroke-dasharray="5 3" stroke-dashoffset="1"/>
</svg>
